[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paleoast"
version = "1.0.1"
description = "Paleontological Advanced Statistical Toolkit - Professional desktop application for paleontological data analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PaleoAST Development Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
full = [
    "networkx>=3.1",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "mplcursors>=0.5.1",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.4.0",
    "ruff>=0.4.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
paleoast = "main:main"

[tool.setuptools.packages.find]
include = [
    "config*",
    "controllers*",
    "ecology*",
    "hpc*",
    "macroevolution*",
    "models*",
    "morpho3d*",
    "morphometrics*",
    "parsers*",
    "phylogenetics*",
    "reporting*",
    "state_machine*",
    "statistics*",
    "stratigraphy*",
    "utils*",
    "views*",
    "visualization*",
    "app_infrastructure*",
]
exclude = [
    "tests*",
    "tests_morpho3d_macroevolution*",
]

# =============================================================================
# Ruff - Code Linting & Formatting
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (lazy imports inside functions are intentional)
    "E741",   # ambiguous variable name (common in scientific code: l, O, I)
    "N802",   # function name should be lowercase (scientific convention: PCA, NMDS)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N811",   # constant imported as non-constant (used for i18n dict aliases)
    "N815",   # mixedCase in class scope (PyQt signals follow Qt's camelCase convention)
    "UP007",  # use X | Y for union types (keep Optional for readability)
    "B007",   # unused loop control variable
    "B904",   # raise from in except (deferred; tracked as tech-debt)
    "F402",   # import shadowed by loop variable (idiomatic in for _ in range(...))
    "SIM102", # nested if statements (sometimes clearer for parsers/validators)
    "SIM103", # return negated condition (deferred; tracked as tech-debt)
    "SIM105", # use contextlib.suppress (try/except is more explicit)
    "SIM108", # use ternary operator (reduces readability for scientific code)
    "RUF012", # mutable class variables without ClassVar
    "RUF001", # ambiguous unicode character in string (Chinese characters)
    "RUF002", # ambiguous unicode character in docstring (Chinese characters)
    "RUF003", # ambiguous unicode character in comment (Chinese characters)
]

[tool.ruff.lint.per-file-ignores]
"tests_morpho3d_macroevolution/**/*.py" = ["E", "W", "F", "B008", "N"]
"test_regression.py" = ["E", "W", "F"]

[tool.ruff.lint.isort]
known-first-party = [
    "config", "controllers", "ecology", "models", "views",
    "statistics", "morphometrics", "morpho3d", "stratigraphy",
    "visualization", "utils", "phylogenetics", "macroevolution",
    "parsers", "hpc", "reporting", "state_machine", "app_infrastructure",
]

# =============================================================================
# Mypy - Static Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = false
ignore_errors = false
disable_error_code = [
    "union-attr",     # Optional/None narrowing across function boundaries
    "arg-type",        # ndarray dtype/Shape mismatches (numpy is too dynamic)
    "assignment",      # Type widening in scientific code is common
    "attr-defined",    # Plugin / dynamic dispatch patterns
    "index",           # numpy / dict indexing
    "call-overload",   # numpy ufunc dispatch
    "operator",        # numeric operators on Any
    "return-value",    # numpy return-type inference is unreliable
    "misc",            # miscellaneous mypy quirks
    "has-type",        # Any-typed values
    "var-annotated",   # inferred type annotations
    "no-redef",        # intentional name reuse
    "used-before-def", # forward references in dataclasses
    "override",        # subclass overrides without @override
]

# Mypy does not understand the dynamic patterns common in scientific
# code (numpy shape manipulations, optional/None unions across function
# boundaries, PyQt slots). The per-module overrides below silence the
# noise that would otherwise drown the real signal.
[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "matplotlib.*",
    "mplcursors.*",
    "sklearn.*",
    "statsmodels.*",
    "networkx.*",
    "psutil.*",
    "openpyxl.*",
    "xlrd.*",
]
ignore_missing_imports = true

# View layer: heavy use of PyQt slots, dynamic signals, and lazy
# imports. We disable all type errors here because the code is
# fundamentally correct and refactoring just to satisfy mypy would
# be a poor return on investment.
[[tool.mypy.overrides]]
module = [
    "views.*",
    "app_infrastructure.*",
    "main",
]
ignore_errors = true

# =============================================================================
# Pytest - Testing Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests_morpho3d_macroevolution", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = [
    "config",
    "controllers",
    "ecology",
    "models",
    "statistics",
    "morphometrics",
    "morpho3d",
    "stratigraphy",
    "utils",
    "views",
    "visualization",
]
omit = [
    "tests*",
    "tests_morpho3d_macroevolution*",
    "app_infrastructure*",
    "test_regression.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]
