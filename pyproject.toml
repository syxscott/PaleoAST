[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paleoast"
version = "1.1.0"
description = "Paleontological Advanced Statistical Toolkit - Professional desktop application for paleontological data analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PaleoAST Development Team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "PyQt6>=6.5.0",
]

[project.optional-dependencies]
full = [
    "networkx>=3.1",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "mplcursors>=0.5.1",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.4.0",
    "ruff>=0.4.0",
    # tests/property/* imports hypothesis unconditionally, and the
    # ``addopts`` below passes ``--hypothesis-show-statistics``. Without this
    # entry a fresh ``pip install -e .[dev]`` makes ``pytest`` fail at
    # collection with "unrecognized arguments: --hypothesis-show-statistics".
    "hypothesis>=6.0.0",
]
# The R bridge is its own extra, NOT part of `dev`, on purpose.
#
# Installing rpy2 needs a working R toolchain (libR headers from r-base-dev).
# With it in `dev`, every job that runs `pip install -e ".[dev,full]"`
# inherited that failure and died at the install step -- 8 of the 12 matrix
# jobs plus the property-tests job, none of which have anything to do with R.
# tests/cross_validation/ skips itself without rpy2 (see
# tests/cross_validation/_rbridge.py), so those jobs lose nothing here.
crossval = [
    # Two separate version traps, both found by the CI log rather than guessed.
    #
    # 1. `rpy2>=5.0.0` (the original) named a version that does not exist --
    #    rpy2 has never released a 5.x, 3.6.8 is the latest. pip could not
    #    resolve it, so every job installing `[dev,full]` died at the install
    #    step, which is how 9 jobs stayed red for the whole history of this
    #    workflow.
    #
    # 2. rpy2 3.6.x then installed but could not load against the R that
    #    ubuntu-latest ships:
    #        ffi.error: symbol 'R_getVar' not found in
    #        library '/usr/lib/R/lib/libR.so'
    #    `R_getVar` does not exist in R 4.3.3, which is what the runner provides.
    #    The 3.5 series targets R 4.x and loads cleanly, so the ceiling is 3.6.
    #
    # Raise this ceiling only together with the R version in
    # .github/workflows/ci.yml, and only after confirming the pair loads -- they
    # are one constraint, not two independent ones.
    "rpy2>=3.5.16,<3.6; platform_system != 'Windows'",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
paleoast = "main:main"
# Headless counterpart to the script console. Same session, same
# namespace; the only difference is that the data comes from a file
# instead of whatever spreadsheet happens to be open, and that a long
# run is not sitting behind a window that can be closed by accident.
paleoast-run = "utils.script_cli:main"

[tool.setuptools]
# ``main.py`` and ``plot_export.py`` are top-level modules, not packages.
# ``packages.find`` alone does not ship them, so the ``paleoast`` console
# script and ``views/ui_plot_export_dialog.py``'s ``from plot_export import
# ...`` both failed on a non-editable install.
py-modules = ["main", "plot_export"]

[tool.setuptools.package-data]
# ``data/loader.py`` resolves these through ``importlib.resources.files("data")``,
# so a wheel without them makes every ``load_*()`` raise FileNotFoundError.
"data" = ["examples/*", "golden/*"]

[tool.setuptools.packages.find]
# NOTE: `_core`, `rthooks` and `app_infrastructure` are GONE from disk. They
# were empty (0 files), untracked by git, and had zero import sites anywhere
# (including tests); `rthooks/` was additionally dead because
# ``PaleoAST.spec`` ships ``runtime_hooks=[]``. The now-empty directories were
# removed on 2026-10-01 -- git never recorded them, so there is nothing to
# delete from the index. If you reintroduce any of these names, add them here.
include = [
    "config*",
    "controllers*",
    "data*",
    "ecology*",
    "hpc*",
    "macroevolution*",
    "models*",
    "morpho3d*",
    "morphometrics*",
    "parsers*",
    "phylogenetics*",
    "plugins*",
    "presets*",
    "reporting*",
    "state_machine*",
    # NOT "statistics*": a top-level package named `statistics` is permanently
    # shadowed by the standard library's `statistics` module, because the
    # stdlib precedes site-packages on sys.path. A wheel install therefore
    # resolved `import statistics` to the stdlib and every `from
    # statistics.pca import ...` failed, leaving the app unable to start.
    # Found by scripts/import_smoke.py, which imports a built wheel from
    # outside the source tree. Renamed to `stats/` -- keep it that way.
    "stats*",
    "stratigraphy*",
    "utils*",
    "views*",
    "visualization*",
]
exclude = [
    "tests*",
    "tests_morpho3d_macroevolution*",
]

# =============================================================================
# Ruff - Code Linting & Formatting
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (lazy imports inside functions are intentional)
    "E741",   # ambiguous variable name (common in scientific code: l, O, I)
    "N802",   # function name should be lowercase (scientific convention: PCA, NMDS)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "N811",   # constant imported as non-constant (used for i18n dict aliases)
    "N815",   # mixedCase in class scope (PyQt signals follow Qt's camelCase convention)
    "UP007",  # use X | Y for union types (keep Optional for readability)
    "B007",   # unused loop control variable
    "B904",   # raise from in except (deferred; tracked as tech-debt)
    "F402",   # import shadowed by loop variable (idiomatic in for _ in range(...))
    "SIM102", # nested if statements (sometimes clearer for parsers/validators)
    "SIM103", # return negated condition (deferred; tracked as tech-debt)
    "SIM105", # use contextlib.suppress (try/except is more explicit)
    "SIM108", # use ternary operator (reduces readability for scientific code)
    "RUF012", # mutable class variables without ClassVar
    "RUF001", # ambiguous unicode character in string (Chinese characters)
    "RUF002", # ambiguous unicode character in docstring (Chinese characters)
    "RUF003", # ambiguous unicode character in comment (Chinese characters)
]

[tool.ruff.lint.per-file-ignores]
"tests_morpho3d_macroevolution/**/*.py" = ["E", "W", "F", "B008", "N"]
"scripts/smoke_check.py" = ["E", "W", "F"]
# Named after the ProcD-LM method it implements, not after a snake_case noun.
# Renaming the module would break the cross-validation job that references it,
# and the name is the only place the method is identifiable.
"stats/procD_lm.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = [
    "config", "controllers", "data", "ecology", "models", "views",
    "stats", "morphometrics", "morpho3d", "stratigraphy",
    "visualization", "utils", "phylogenetics", "macroevolution",
    "parsers", "hpc", "reporting", "state_machine",
]

# =============================================================================
# Mypy - Static Type Checking
# =============================================================================
[tool.mypy]
# CI typecheck 作业运行在 Python 3.12; 3.10 目标下 numpy 新版 stubs
# 的 PEP 695 `type` 语句会报语法错误 (mypy: numpy/__init__.pyi syntax error)
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = false
ignore_errors = false
disable_error_code = [
    "union-attr",     # Optional/None narrowing across function boundaries
    "arg-type",        # ndarray dtype/Shape mismatches (numpy is too dynamic)
    "assignment",      # Type widening in scientific code is common
    "attr-defined",    # Plugin / dynamic dispatch patterns
    "index",           # numpy / dict indexing
    "call-overload",   # numpy ufunc dispatch
    "operator",        # numeric operators on Any
    "return-value",    # numpy return-type inference is unreliable
    "misc",            # miscellaneous mypy quirks
    "has-type",        # Any-typed values
    "var-annotated",   # inferred type annotations
    "no-redef",        # intentional name reuse
    "used-before-def", # forward references in dataclasses
    "override",        # subclass overrides without @override
]

# Mypy does not understand the dynamic patterns common in scientific
# code (numpy shape manipulations, optional/None unions across function
# boundaries, PyQt slots). The per-module overrides below silence the
# noise that would otherwise drown the real signal.
[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "matplotlib.*",
    "mplcursors.*",
    "sklearn.*",
    "statsmodels.*",
    "networkx.*",
    "psutil.*",
    "openpyxl.*",
    "xlrd.*",
]
ignore_missing_imports = true

# View layer: heavy use of PyQt slots, dynamic signals, and lazy
# imports. We disable all type errors here because the code is
# fundamentally correct and refactoring just to satisfy mypy would
# be a poor return on investment.
[[tool.mypy.overrides]]
module = [
    "views.*",
    "main",
]
ignore_errors = true

# =============================================================================
# Pytest - Testing Configuration
# =============================================================================
[tool.pytest.ini_options]
# NOTE: "." used to be listed here so that the root-level ``test_regression.py``
# got picked up. It never actually contributed a test: its 31 functions are
# named ``t_*``/``test`` and match neither ``python_functions`` nor
# ``python_classes``, so pytest collected zero items from it -- while still
# IMPORTING the module, which executed ~27 top-level ``test(...)`` calls, ran
# ``matplotlib.use("Agg")`` over the whole session and printed to stdout. That
# file now lives at ``scripts/smoke_check.py`` and is run manually.
testpaths = ["tests", "tests_morpho3d_macroevolution"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--hypothesis-show-statistics",
]
markers = [
    "slow: marks tests as slow (deselect with -m not slow)",
    "integration: marks tests as integration tests",
    "unit: unit tests for individual functions",
    "property: property-based tests using Hypothesis",
    "cross_validation: cross-validation tests against R package gold standards",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
# Measured over every package the wheel actually ships -- the same set as
# [tool.setuptools.packages.find] include below. This list used to name only 13
# of the 22 packages, so hpc/, macroevolution/, parsers/, phylogenetics/,
# plugins/, presets/, reporting/, state_machine/ and stats/ were invisible to
# coverage and could regress with no effect on the number. Keep the two lists
# in sync; the gap is exactly the kind of thing that makes a gate meaningless.
source = [
    "config",
    "controllers",
    "data",
    "ecology",
    "hpc",
    "macroevolution",
    "models",
    "morpho3d",
    "morphometrics",
    "parsers",
    "phylogenetics",
    "plugins",
    "presets",
    "reporting",
    "state_machine",
    "stats",
    "stratigraphy",
    "utils",
    "views",
    "visualization",
]
omit = [
    "tests*",
    "tests_morpho3d_macroevolution*",
    "scripts*",
]

[tool.coverage.report]
# Measured 44.68% (12477/27925 statements) on Python 3.10 / Windows with
# `pytest tests/ tests_morpho3d_macroevolution/ -m "not cross_validation"`,
# over every package the wheel ships (see the [tool.coverage.run] source list
# above). The gate sits ~1.7 points below that -- about 470 statements of
# headroom -- so ordinary platform and dependency drift does not flip CI red,
# while a real regression still fails the build: dropped tests, a module
# removed from testpaths, a dependency bump that starts skipping.
#
# This replaced a hardcoded `--fail-under=10` in .github/workflows/ci.yml, which
# sat 4.5x below the real number and so could not fail for any realistic
# regression. The threshold lives here, in one place, so the CI job and a local
# `pytest --cov` cannot disagree.
#
# What keeps the number where it is, roughly in order of cost:
#   UI and plotting, which needs a live Qt event loop --
#     views/ui_main_window.py 7.9% (2782 statements, the largest file in the
#     repo), views/ui_plot_canvas.py 13.6%, visualization/* mostly 9-14%
#   completely untested but shipped --
#     config/imputation.py 0/170, plugins/ 0/124, reporting/matrix_converter.py
#     0/23, reporting/table_generator.py 0/28
#   lightly tested -- hpc/ 31.7%, phylogenetics/ 46.5%, state_machine/ 55.8%
# Raising this gate means testing those, not lowering the gate here. The
# well-covered engines (stats 65.4%, parsers 73.7%, macroevolution 77.1%,
# presets 98.3%) are what pull the average up over the UI floor.
fail_under = 43
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]
