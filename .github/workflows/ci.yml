name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # Lint & Style Check
  # =========================================================================
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # =========================================================================
  # Type Checking
  # =========================================================================
  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy numpy scipy pandas matplotlib PyQt6
      - run: mypy --config-file pyproject.toml config/ models/ controllers/ statistics/ ecology/ utils/ views/

  # =========================================================================
  # Unit Tests
  # =========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        # The morpho3d / quaternion / regression suites are pure-numpy
        # and don't need a display. ``xvfb-run`` is still installed in
        # case any future test requires Qt.
        run: |
          pytest tests_morpho3d_macroevolution/ tests/ --tb=short --cov --cov-report=xml

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          pytest tests_morpho3d_macroevolution/ tests/ --tb=short --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
