name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # Lint & Style Check
  # =========================================================================
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # =========================================================================
  # Type Checking
  # =========================================================================
  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy numpy scipy pandas matplotlib PyQt6
      - run: mypy --config-file pyproject.toml config/ models/ controllers/ stats/ ecology/ utils/ views/

  # =========================================================================
  # Unit & Property Tests (full matrix)
  # =========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries for PyQt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install hypothesis  # property-based testing

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          # 无显示的 Linux runner 需要 offscreen 平台, 否则 PyQt6 导入
          # 即抛 libEGL.so.1 ImportError (tests/*controller、views 全挂)
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || 'cocoa' }}
        run: |
          pytest tests/ tests_morpho3d_macroevolution/             -m "not cross_validation"             --tb=short --cov --cov-report=xml

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          pytest tests/ tests_morpho3d_macroevolution/             -m "not cross_validation"             --tb=short --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # =========================================================================
  # Property-Based Tests (Hypothesis) - separate job for visibility
  # =========================================================================
  property-tests:
    name: Hypothesis Property Tests (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install hypothesis
      - name: Run property tests
        run: |
          pytest tests/property/ --hypothesis-show-statistics -v --tb=short

  # =========================================================================
  # Cross-Validation Tests (with rpy2)
  # =========================================================================
  cross-validation:
    name: Cross-Validation vs R (vegan/ape/geomorph/iNEXT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R toolchain and reference packages
        run: |
          sudo apt-get update
          # r-base-dev is not optional here. rpy2 compiles against libR, and the
          # CRAN packages below ship no Linux binaries, so they compile from
          # source too -- which needs the R headers plus a C/C++ toolchain.
          # curl/ssl/xml2 are the system libs those R packages commonly link;
          # the image/graphics block is for the stack geomorph pulls in
          # transitively -- rgl needs X11 and GLMesa headers, jpeg needs
          # libjpeg -- and without it every archived geomorph release fails the
          # same way. See the geomorph block below.
          #
          # The rpy2 pin in pyproject.toml (<3.6) is a constraint on THIS R, not
          # on rpy2 in the abstract: rpy2 3.6 imports `R_getVar`, which does not
          # exist in the R 4.3.3 that ubuntu-latest ships, and dies at import
          # with `ffi.error: symbol 'R_getVar' not found`. If the R version here
          # is ever raised, revisit the rpy2 pin in the same change.
          echo "R version rpy2 will bind to:"
          R --version | head -1 || true
          sudo apt-get install -y r-base r-base-dev build-essential \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libjpeg-dev libtiff-dev libpng-dev libfreetype6-dev libcairo2-dev \
            libx11-dev libglu1-mesa-dev libfftw3-dev
          # Reported after the install, so it is the R rpy2 will actually load
          # rather than whatever the image happened to ship.
          echo "R version after install:"
          R --version | head -1
          # The runner user cannot write to site-library, so this must run under
          # sudo (an earlier version of this step failed here).
          #
          # rgl and jpeg are listed explicitly even though nothing else here
          # needs them: they are geomorph's dependencies, and installing
          # geomorph from a bare tarball URL below does NOT resolve
          # dependencies -- `install.packages(url, repos = NULL)` only unpacks
          # the tarball you hand it. Omitting them made every geomorph
          # candidate fail with
          #   ERROR: dependencies 'RRPP', 'rgl', 'jpeg' are not available
          # The system libraries they need are in the apt line above.
          sudo R -e "install.packages(c('vegan','ape','phytools','iNEXT','RRPP','rgl','jpeg'), repos='https://cloud.r-project.org', Ncpus=4)"
          # geomorph is installed separately, from the CRAN archive, newest
          # archived release first. Two independent reasons it cannot come from
          # CRAN directly, both read out of the log rather than guessed:
          #   - 4.1.0 (current) and 4.0.8 / 4.0.9 / 4.0.10 all declare
          #     "R (>= 4.4.0)" and R refuses them against the 4.3.3 that
          #     ubuntu-24.04 provides:
          #       ERROR: this R is version 4.3.3, package 'geomorph' requires R >= 4.4.0
          #     so the list has to reach further back, to 4.0.7 and older;
          #   - and the newer ones also carry the dependency problem above.
          # Newest first means a future runner with a newer R picks the newest
          # release without anyone editing this file. The list is six deep so it
          # survives a geomorph release too. If none build, R exits non-zero
          # rather than letting the step pass quietly.
          sudo R --slave -e '
            ok <- FALSE
            for (v in c("4.0.10", "4.0.9", "4.0.8", "4.0.7", "4.0.6", "4.0.5")) {
              url <- sprintf("https://cran.r-project.org/src/contrib/Archive/geomorph/geomorph_%s.tar.gz", v)
              try(install.packages(url, repos = NULL, type = "source"), silent = TRUE)
              if (requireNamespace("geomorph", quietly = TRUE)) {
                cat("geomorph", as.character(utils::packageVersion("geomorph")), "installed\n")
                ok <- TRUE
                break
              }
            }
            if (!ok) quit(status = 1)
          '
          # `sudo R` installs into /usr/local/lib/R/site-library, but rpy2
          # resolves its library from R_LIBS*, which on Ubuntu does not include
          # that directory. Without this, importr() reports
          #   library '/usr/lib/R/site-library' contains no packages
          # and every cross-validation module skips -- a green-looking run that
          # compared nothing. The path is read back from R itself rather than
          # hardcoded, so it keeps working if the runner image moves.
          echo "R .libPaths():"
          R -q -s -e '.libPaths()' || true
          LIBPATH="$(R --slave --no-save -e 'cat(paste(.libPaths(), collapse=":"))' | tr -d "'\r\n")"
          echo "R library path exported to rpy2: ${LIBPATH}"
          echo "R_LIBS_SITE=${LIBPATH}" >> "$GITHUB_ENV"

      - name: Install Python deps and verify R is reachable
        # Installs rpy2 here, then proves the four reference packages load
        # through it. Fails the job rather than letting the suite skip: an
        # all-skipped cross-validation run is indistinguishable from a passing
        # one in the job summary, which is exactly how the previous suite hid
        # for so long.
        run: |
          python -m pip install --upgrade pip
          # `crossval` is the extra that carries rpy2. It used to sit in `dev`,
          # where it broke the install step of every job that had no use for R
          # -- see the comment in pyproject.toml.
          pip install -e ".[dev,full,crossval]"
          python - <<'PY'
          import sys
          from rpy2.robjects.packages import importr

          missing = []
          for package in ("vegan", "ape", "geomorph", "iNEXT"):
              try:
                  importr(package)
              except Exception as exc:
                  missing.append(f"{package}: {exc}")

          if missing:
              print("reference R packages NOT reachable from rpy2:", file=sys.stderr)
              for item in missing:
                  print("  -", item, file=sys.stderr)
              sys.exit(1)
          print("all four reference R packages import through rpy2")
          PY

      - name: Run cross-validation tests
        # These compare PaleoAST against values the R packages compute *during*
        # this run -- there are no precomputed expectations in the suite, which
        # is the point. `-rs` shows why anything skipped: a missing rpy2 or a
        # missing CRAN package shows up as a skip reason rather than as a
        # silent pass.
        run: |
          pytest tests/cross_validation/ -v --tb=short -rs

  # =========================================================================
  # Package Build & Import Smoke Test (NON-editable install)
  # =========================================================================
  # Every other job in this file installs with ``pip install -e .``, which puts
  # the repository root on sys.path. That makes real packaging bugs invisible:
  # a package missing from the wheel still imports because the checkout happens
  # to sit right there, ``py-modules`` omissions are masked, and
  # ``package-data`` omissions only surface at runtime inside load_*().
  #
  # This job is the only one that installs a built wheel into a clean venv and
  # imports it from OUTSIDE the source tree, so it is the only job that can
  # catch those. It intentionally does not depend on ``test``.
  package:
    name: Wheel Build & Import Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for PyQt6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install the wheel into a clean venv
        run: |
          # Deliberately NOT inside the checkout. A venv nested in the workspace
          # puts every installed path under the repository root, which made the
          # smoke test report a perfectly good install as "resolved from the
          # source checkout" on this runner. The venv has to sit outside it for
          # the shadowing check to mean anything.
          python -m venv "$RUNNER_TEMP/smoke-venv"
          # deps come from the project metadata, the wheel under test does not
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install dist/*.whl

      - name: Import smoke test (from outside the source tree)
        env:
          # Importing views/controllers pulls in PyQt6.QtWidgets, which needs a
          # platform plugin even when nothing is shown. Same reason the test
          # job sets this.
          QT_QPA_PLATFORM: offscreen
        run: |
          # Run from $RUNNER_TEMP as well: running the script by path adds only
          # scripts/ to sys.path, but staying out of the checkout removes any
          # doubt that the wheel is what got imported.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/import_smoke.py" --verbose

      - name: Console script resolves to a callable entry point
        run: |
          # A generated wrapper that raises ModuleNotFoundError on first run is
          # a packaging bug the import smoke test cannot see: it only checks
          # the entry point is *declared*, not that it *loads*.
          "$RUNNER_TEMP/smoke-venv/bin/python" -c "from importlib.metadata import entry_points; \
            ep = next(e for e in entry_points(group='console_scripts') if e.name == 'paleoast'); \
            print(ep.module + ':' + ep.attr, '->', ep.load()); \
            assert callable(ep.load())"

      - name: Package data is present in the wheel
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [p for p in ("data/examples/", "data/golden/") if not any(n.startswith(p) for n in names)]
          if missing:
              sys.exit(f"wheel is missing package data: {missing}")
          print("wheel contains", len(names), "entries, package data OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # =========================================================================
  # Coverage Report
  # =========================================================================
  coverage:
    name: Coverage Report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install hypothesis
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Generate coverage report
        # No --fail-under here on purpose: the gate lives in
        # [tool.coverage.report] fail_under (pyproject.toml) so this job and a
        # local `pytest --cov` enforce the same number. It previously passed an
        # explicit --fail-under=10, roughly 4x below the measured 39.84%.
        run: |
          pip install coverage
          coverage report
