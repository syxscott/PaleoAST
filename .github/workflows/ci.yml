name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # Lint & Style Check
  # =========================================================================
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # =========================================================================
  # Type Checking
  # =========================================================================
  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy numpy scipy pandas matplotlib PyQt6
      - run: mypy --config-file pyproject.toml config/ models/ controllers/ statistics/ ecology/ utils/ views/

  # =========================================================================
  # Unit & Property Tests (full matrix)
  # =========================================================================
  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install hypothesis  # property-based testing

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pytest tests/ tests_morpho3d_macroevolution/             -m "not cross_validation"             --tb=short --cov --cov-report=xml

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          pytest tests/ tests_morpho3d_macroevolution/             -m "not cross_validation"             --tb=short --cov --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # =========================================================================
  # Property-Based Tests (Hypothesis) - separate job for visibility
  # =========================================================================
  property-tests:
    name: Hypothesis Property Tests (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install hypothesis
      - name: Run property tests
        run: |
          pytest tests/property/ --hypothesis-show-statistics -v --tb=short

  # =========================================================================
  # Cross-Validation Tests (with rpy2)
  # =========================================================================
  cross-validation:
    name: Cross-Validation vs R (Python 3.12, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install R and rpy2
        run: |
          sudo apt-get update && sudo apt-get install -y r-base
          R -e "install.packages(c('vegan','geomorph','ape','phytools','iNEXT'), repos='https://cloud.r-project.org')"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install rpy2 hypothesis
      - name: Run cross-validation tests
        run: |
          pytest tests/cross_validation/ -v --tb=short

  # =========================================================================
  # Coverage Report
  # =========================================================================
  coverage:
    name: Coverage Report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"
          pip install hypothesis
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Generate coverage report
        run: |
          pip install coverage
          coverage report --fail-under=10
