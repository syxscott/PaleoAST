# Dependabot version updates.
#
# Checking this file in makes Dependabot start checking the manifests below on
# its own schedule and open pull requests when something is outdated. It is
# independent of the repository-level "Dependabot security updates" switch
# (Settings -> Code security and analysis -> Dependabot security updates),
# which only handles known vulnerabilities.
#
# The two ``updates`` blocks cover every manifest this repository ships:
#   * ``pip``           -> requirements.txt, pyproject.toml, uv.lock (root)
#   * ``github-actions`` -> .github/workflows/*.yml
#
# Both blocks deliberately leave merging to a human. No auto-merge is wired up
# anywhere in this repository, so every pull request Dependabot opens has to
# be read and merged on purpose.
version: 2

updates:
  # Python dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip): "
    # The requirements are written as lower bounds (``numpy>=1.24.0``). With
    # the default strategy Dependabot would widen the range instead of
    # raising the floor, and because the floor already admits the newest
    # release it would conclude that nothing needs to change. "increase"
    # raises the floor to the newest release, which is what makes the
    # manifest state the version it is actually tested against.
    versioning-strategy: increase
    # What may arrive on its own:
    #   * patches and minors -- mechanical, and CI is the gate.
    #   * majors never. numpy 2.x, pandas 3.x and pytest 9 move the APIs the
    #     test suite is written against, so a major bump is a deliberate act
    #     with its own migration commit, not something a bot does on its own.
    #     Dependabot closes the pull requests of ignored dependencies on its
    #     next run.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # ruff is pinned on purpose in pyproject.toml and in
      # .github/workflows/ci.yml, with the reason written next to the pin:
      # ``ruff format --check`` is a gate, and a gate whose result depends on
      # which ruff was published that morning is not a gate.  Bumping it
      # means reformatting the tree in the same commit -- a job for a human.
      - dependency-name: "ruff"
        versions: [">=0.16.11"]
      # PyQt6 6.12.0 ships stubs that are not valid Python (the type check
      # job says so at the pin), which breaks mypy for everyone who has it
      # installed.  Do not raise the floor past 6.11.0 until upstream fixes
      # the stubs.
      - dependency-name: "PyQt6"
        versions: [">=6.12.0"]
      # rpy2 3.6.x installs but cannot load against the R that ubuntu-latest
      # ships: "symbol 'R_getVar' not found in library
      # '/usr/lib/R/lib/libR.so'" -- R_getVar does not exist in R 4.3.3, which
      # is what the runner provides.  That is why the ceiling in
      # pyproject.toml is 3.6, and the note there says it moves only together
      # with the R version in the workflow.  The bot must not propose it on
      # its own.
      - dependency-name: "rpy2"
        versions: [">=3.6.0"]
    groups:
      # Minor and patch bumps are mechanical; they travel together.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by .github/workflows/ci.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions): "
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
